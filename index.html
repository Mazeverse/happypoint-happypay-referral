<!doctype html>
<html lang="ko">
<head>

<body>
  <main class="page-shell">
    <section class="card" aria-labelledby="page-title">
      <div class="confetti confetti-1">✦</div>
      <div class="confetti confetti-2">●</div>
      <div class="confetti confetti-3">♥</div>

      <h1 id="page-title">3천원을 선물했어요<span class="gift-inline">🎁</span></h1>
      <p class="subtitle">친구추천 코드를 입력하고 혜택을 받아보세요.</p>

      </div>

      <p class="footnote">혜택 조건과 지급 여부는 해피포인트/해피페이의 최신 이벤트 정책을 확인해주세요.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">추천코드가 복사됐어요!</div>
